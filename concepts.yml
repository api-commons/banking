findings:
  - "Open-banking standards dominate banking APIs, and measured naively they ARE the
    vocabulary: fifty Australian banks implement the Consumer Data Right and some thirty UK
    providers the Open Banking UK standard. Counted per bank, a beneficiary's 'core' was
    CDR's own field names. Counted once per standard, the market's own agreement shows."
  - "A bank account agrees on name, type, status, currency, id, account number and balance --
    once the open-banking standards count once, a proprietary bank account and a standardised
    one share the shape."
  - "A transaction agrees on id, amount, status, direction and description -- direction
    (credit or debit) is core, which is not true of a payment in the payments context."
  - "Balances agree on nothing outright: account, available and currency all sit just under
    half. Open-banking standards split a balance into typed entries; proprietary APIs carry
    available and current side by side."
decisions:
  - "A standard counts once. The 50 CDR banks are one voice (`au-cdr-banking`) and the UK Open
    Banking implementers another (`open-banking-uk`), identified by the standards' own paths.
    Every bank keeps its own crosswalk, marked with the standard it implements. Revolut,
    Barclays and Zopa also publish proprietary APIs and are counted on their own."
  - "Money moving between accounts is a `transfer` at `/transfers`, though banks say
    `payments` (64 providers, against 29): `/payments` is the payments context's, and an
    open-banking payment initiation is an account-to-account transfer."
  - "A counterparty is a `beneficiary` at `/beneficiaries`: beneficiaries lead (19) and the
    word collides with nothing."
  - "A bank account is `/accounts`, the market's word (123 providers), because inside banking
    it means only one thing. Accounting uses `/ledger-accounts` to stay clear of it."
