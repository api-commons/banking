context: banking
name: Banking
intro: >-
  The common banking vocabulary -- bank accounts, their balances and transactions, the
  counterparties money is sent to, the transfers that send it and the statements that
  record it -- distilled from the APIs that already exist, open-banking standards included.
tags: [Banking, Open Banking, Consumer Banking, Banking as a Service, Neobank, Digital Banking, Core Banking]

