# Different banks republishing one STANDARD: each is an adopter with its own crosswalk, but
# the vocabulary counts once, because it was written once. Members were identified by the
# standard's own paths (/banking/... for CDR; /aisp, /domestic-payments, consents for UK
# Open Banking). Revolut, Barclays and Zopa also publish proprietary APIs and stay separate.
