arazzo: 1.0.1
info:
  title: Banking workflows (API Commons)
  version: 0.1.0-draft.20261111
  summary: Reference workflows over the common Banking operations.
  description: 'Reference compositions of the operations this context''s providers share. Not measured: every step
    is a core- or extended-tier operation of the common OpenAPI, so the workflow runs against any provider that
    implements those operations (see crosswalk/).'
sourceDescriptions:
- name: banking
  url: ./openapi.yml
  type: openapi
workflows:
- workflowId: pay-a-beneficiary
  summary: Add a beneficiary and transfer money to them from an account
  description: Add a beneficiary and transfer money to them from an account.
  inputs:
    type: object
    required:
    - account_id
    properties:
      account_id:
        type: string
  steps:
  - stepId: account
    operationId: getBankAccount
    description: Get a bank account -- a core-tier operation (80% of providers).
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      id: $response.body#/id
    parameters:
    - name: bank_account_id
      in: path
      value: $inputs.account_id
  - stepId: beneficiary
    operationId: createBeneficiary
    description: Create a beneficiary -- a core-tier operation (56% of providers).
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      id: $response.body#/id
  - stepId: transfer
    operationId: createTransfer
    description: Create a transfer -- a core-tier operation (88% of providers).
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      id: $response.body#/id
    requestBody:
      contentType: application/json
      payload:
        from_account_id: $steps.account.outputs.id
        to_account_id: $steps.beneficiary.outputs.id
  x-commons-tiers:
  - core
